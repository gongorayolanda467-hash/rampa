<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Rampa Fácil</title>
<meta name="description" content="Inicie sesión para ver y seguir sus solicitudes de rampa.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F3D70">
<meta property="og:site_name" content="Rampa Fácil">
<meta property="og:title" content="Entrar · Rampa Fácil">
<meta property="og:description" content="Inicie sesión para ver y seguir sus solicitudes de rampa.">
<meta property="og:image" content="https://rampa-facil.onrender.com/img/og-image.png">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/common.js" defer></script>
<script src="/js/auth.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>
<header id="site-header" class="site-header"></header>

<main id="main" class="page container">
  <div class="auth-wrap card">
    <h1>Entrar</h1>
    <p class="muted">Vea el estado de sus solicitudes y pida nuevas cotizaciones.</p>
    <form class="form" id="login-form" novalidate>
      <div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"></div>
      <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"></div>
      <div data-status class="hidden"></div>
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
    <p class="small">¿No tiene cuenta? <a href="/registro" id="to-register">Crear una cuenta</a></p>
    <p class="small muted">¿Olvidó su contraseña? Llámenos al <span data-site="phone"></span> y le ayudamos a recuperarla.</p>
  </div>
</main>
<footer id="site-footer" class="site-footer"></footer>
</body>
</html>

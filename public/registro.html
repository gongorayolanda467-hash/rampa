<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta · Rampa Fácil</title>
<meta name="description" content="Cree su cuenta gratis para pedir una cotización de rampa y seguir su solicitud.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0F3D70">
<meta property="og:site_name" content="Rampa Fácil">
<meta property="og:title" content="Crear cuenta · Rampa Fácil">
<meta property="og:description" content="Cree su cuenta gratis para pedir una cotización de rampa y seguir su solicitud.">
<meta property="og:image" content="https://rampa-facil.onrender.com/img/og-image.png">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/common.js" defer></script>
<script src="/js/auth.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>
<header id="site-header" class="site-header"></header>

<main id="main" class="page container">
  <div class="auth-wrap card">
    <h1>Crear cuenta</h1>
    <p class="muted">Es gratis. Con su cuenta pide cotizaciones y sigue cada paso de su rampa.</p>
    <form class="form" id="register-form" novalidate>
      <div class="field"><label for="name">Nombre completo</label><input id="name" name="name" autocomplete="name" required maxlength="100"></div>
      <div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"></div>
      <div class="field"><label for="phone">Teléfono (opcional)</label><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="30"></div>
      <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="128" aria-describedby="pw-hint"><span class="hint" id="pw-hint">Mínimo 10 caracteres. Use una frase fácil de recordar.</span></div>
      <div class="field"><label class="check"><input type="checkbox" name="accept" id="accept" required> <span>Acepto los <a href="/terminos">términos de uso</a> y el <a href="/privacidad">aviso de privacidad</a>.</span></label></div>
      <div data-status class="hidden"></div>
      <button class="btn btn-primary" type="submit">Crear cuenta</button>
    </form>
    <p class="small">¿Ya tiene cuenta? <a href="/entrar" id="to-login">Entrar</a></p>
  </div>
</main>
<footer id="site-footer" class="site-footer"></footer>
</body>
</html>

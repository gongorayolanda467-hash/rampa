# Blueprint de Render: crea el servicio web y la base de datos PostgreSQL desde este repositorio.
services:
  - type: web
    name: rampa-facil
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rampa-facil-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false

databases:
  - name: rampa-facil-db
    plan: free
    region: ohio
    databaseName: rampafacil
    user: rampafacil
